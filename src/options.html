<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Translator 配置</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">LLM Translator 配置</h1>
  
  <!-- API 配置部分 -->
  <div class="bg-white p-6 rounded-lg shadow mb-6">
    <h2 class="text-xl font-semibold text-gray-700 mb-4">API 配置</h2>
    
    <div class="mb-4">
      <label for="apiEndpoint" class="block text-sm font-medium text-gray-700 mb-1">API 端点</label>
      <input type="text" id="apiEndpoint" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
             placeholder="https://api.openai.com/v1/chat/completions">
    </div>
    
    <div class="mb-4">
      <label for="apiKey" class="block text-sm font-medium text-gray-700 mb-1">API 密钥</label>
      <input type="password" id="apiKey" 
             class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary"
             placeholder="输入你的OpenAI API密钥">
    </div>
    
    <span id="apiStatus" class="text-sm text-green-600"></span>
  </div>

  <!-- 翻译场景配置 -->
  <div class="bg-white p-6 rounded-lg shadow">
    <h2 class="text-xl font-semibold text-gray-700 mb-4">翻译场景配置</h2>
    
    <div id="scenariosContainer" class="space-y-4 mb-4">
      <!-- 场景组将在这里动态添加 -->
    </div>
    
    <button id="addScenario" 
            class="px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
      添加场景
    </button>
    <span id="scenarioStatus" class="ml-2 text-sm text-green-600"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
