<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Translator 配置</title>
  <style>
    body {
      width: 600px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .section {
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 8px;
    }
    .scenario {
      background: #f5f5f5;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .status {
      color: #4CAF50;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>LLM Translator 配置</h1>
  
  <div class="section">
    <h2>API 配置</h2>
    <label for="apiEndpoint">API 端点</label>
    <input type="text" id="apiEndpoint" placeholder="https://api.openai.com/v1/chat/completions">
    
    <label for="apiKey">API 密钥</label>
    <input type="password" id="apiKey" placeholder="输入你的OpenAI API密钥">
    <span id="apiStatus" class="status"></span>
  </div>

  <div class="section">
    <h2>翻译场景配置</h2>
    <div id="scenariosContainer">
      <!-- 场景组将在这里动态添加 -->
    </div>
    <button id="addScenario">添加场景</button>
    <span id="scenarioStatus" class="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
