<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LLM Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4 w-64">
  <div class="space-y-4">
    <h2 class="text-lg font-semibold text-gray-800">翻译设置</h2>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">选择场景</label>
      <select id="scenarioSelect" 
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary">
        <option value="">加载中...</option>
      </select>
    </div>

    <div class="space-y-2">
      <label class="block text-sm font-medium text-gray-700">触发方式</label>
      <div class="space-y-1">
        <div class="flex items-center">
          <input id="hover" name="trigger" type="radio" value="hover" 
                 class="h-4 w-4 text-primary focus:ring-primary">
          <label for="hover" class="ml-2 block text-sm text-gray-700">悬浮按钮点击</label>
        </div>
        <div class="flex items-center">
          <input id="select" name="trigger" type="radio" value="select" 
                 class="h-4 w-4 text-primary focus:ring-primary">
          <label for="select" class="ml-2 block text-sm text-gray-700">选中即触发</label>
        </div>
      </div>
    </div>

    <button id="saveTrigger" 
            class="w-full px-4 py-2 bg-primary text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
      保存设置
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
